spring:
  application:
    name: msequipamento
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/ms-equipamentos-db?createDatabaseIfNotExist=true}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka}"
  instance:
    hostname: localhost
    instance-id: "${spring.application.name}:${random.value}"
