spring:
  application:
    name: msemprestimo
  datasource:
    url: "${DB_URL:jdbc:mysql://localhost:3306/ms-emprestimos-db?createDatabaseIfNotExist=true}"
    username: "${DB_USERNAME:root}"
    password: "${DB_PASSWORD:}"
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_URL:http://localhost:8761/eureka}"
  instance:
    hostname: localhost
    instance-id: "${spring.application.name}:${random.value}"

resilience4j:
  circuitbreaker:
    instances:
      alterarCondicaoEquipamento:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 30s
        permittedNumberOfCallsInHalfOpenState: 2
        recordFailurePredicate: com.aula.pos.msemprestimo.client.TechnicalFailurePredicate
