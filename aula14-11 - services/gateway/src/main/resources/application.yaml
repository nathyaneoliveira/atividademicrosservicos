spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: auth-service
              uri: lb://auth-service
              predicates:
                - Path=/api/v1/auth/**,/api/v1/usuarios/**
            - id: evento-service
              uri: lb://evento-service
              predicates:
                - Path=/api/v1/eventos/**
            - id: inscricao-service
              uri: lb://inscricao-service
              predicates:
                - Path=/api/v1/inscricoes/**
            - id: notification-service
              uri: lb://notification-service
              predicates:
                - Path=/api/v1/notificacoes/**
            - id: msequipamento
              uri: lb://msequipamento
              predicates:
                - Path=/api/v1/equipamentos/**
            - id: msemprestimo
              uri: lb://msemprestimo
              predicates:
                - Path=/api/v1/emprestimos/**
          discovery:
            locator:
              enabled: true
              lower-case-service-id: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${random.value}



