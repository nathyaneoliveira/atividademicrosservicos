spring:
  application:
    name: inscricao-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ms-inscricoes-db?createDatabaseIfNotExist=true
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
  jpa:
    #hibernate:
    #ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

api:
  security:
    token:
      secret: "${JWT_SECRET}"

server:
  port: 8083