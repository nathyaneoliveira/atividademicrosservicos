spring:
  application:
    name: auth-service
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ms-auth-db?createDatabaseIfNotExist=true
    username: "${DB_USERNAME}"
    password: "${DB_PASSWORD}"
  jpa:
    #hibernate:
    #ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

api:
  security:
    token:
      secret: "${JWT_SECRET}"

server:
  port: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    hostname: localhost
    instance-id: ${spring.application.name}:${random.value}